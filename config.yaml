# Paper portfolio + rank-weighted targets (personal experimentation — not investment advice).

initial_cash: 100000.0
stock_weight_cap: 0.95

# Execution: trade at this bar after signals are known (close = same-day close).
execution_bar: close

signals:
  mode: momentum
  lookback_days: 20
  buy_top_n: 8
  sell_bottom_n: 5

benchmark_ticker: SPY

# Real quotes: twelvedata (recommended) or yfinance (often rate-limited).
# API key: environment variable TWELVE_DATA_API_KEY (never commit).
prices:
  provider: twelvedata
  twelvedata:
    # Twelve Data free tier: stay under 8 req/min — 11s ~= max 5.45/min.
    min_interval_sec: 11
    outputsize: 2000

paths:
  portfolio: data/portfolio.json
  equity_history: data/equity_history.jsonl
  signals_out: output/latest_signals.json
  report_html: output/report.html
