name: StockPaper daily

on:
  workflow_dispatch:
  schedule:
    # Weekdays ~after US cash close (UTC). Tune for DST / your timezone.
    - cron: "35 21 * * 1-5"

# contents:write — push updated paper portfolio state back to the repo for rolling simulation.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      # v5+ / v6+ use Node 24 (Node 20 actions deprecated on GitHub-hosted runners).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Twelve Data (set repo secret TWELVE_DATA_API_KEY). On failure, fall back to sample CSV.
      - name: Generate report (Twelve Data)
        id: report
        continue-on-error: true
        run: python -m src.run

      - name: Fallback — sample CSV if API/key/unavailable
        if: steps.report.outcome == 'failure'
        run: python -m src.run --prices-csv examples/sample_closes_wide.csv

      - name: Commit paper portfolio state (rolling sim on next run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json
          if [ -f data/equity_history.jsonl ]; then git add data/equity_history.jsonl; fi
          if git diff --staged --quiet; then
            echo "No changes to data/portfolio.json or data/equity_history.jsonl"
          else
            git commit -m "chore(data): update paper portfolio state [skip ci]"
            git push
          fi

      - name: Prepare GitHub Pages site
        run: mkdir -p _site && cp output/report.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - uses: actions/upload-artifact@v6
        with:
          name: stock-paper-report
          path: output/report.html
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
