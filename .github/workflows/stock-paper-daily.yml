name: StockPaper daily

on:
  workflow_dispatch:
  schedule:
    # Weekdays ~after US cash close (UTC). Tune for DST / your timezone.
    - cron: "35 21 * * 1-5"

# Required for Pages + OIDC deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5+ / v6+ use Node 24 (Node 20 actions deprecated on GitHub-hosted runners).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Uses bundled synthetic OHLC so CI stays green when Yahoo rate-limits.
      # For production runs locally or on a schedule with secrets, drop `--prices-csv`.
      - name: Generate report
        run: python -m src.run --prices-csv examples/sample_closes_wide.csv

      - name: Prepare GitHub Pages site
        run: mkdir -p _site && cp output/report.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - uses: actions/upload-artifact@v6
        with:
          name: stock-paper-report
          path: output/report.html
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
